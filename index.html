<h3>☢ Что это</h3>
<p>«Бункер» — игра на выживание. После катастрофы группа людей пытается попасть в убежище, но мест внутри меньше, чем желающих. Участники раскрывают характеристики персонажей, спорят, договариваются и голосуют, кого исключить. Когда остаётся нужное число выживших, ведущий проверяет, сможет ли бункер обеспечить им жизнь.</p>

<h3>Как начать</h3>
<ul>
<li>Введите имя или войдите через Discord, чтобы автоматически получить ник и аватар. Авторизация необязательна.</li>
<li>Создайте комнату, выберите набор «Стандартный» и отправьте друзьям шестизначный код. Остальные участники вводят его в поле «Войти в комнату».</li>
<li>Когда все подключатся, ведущий запускает игру.</li>
</ul>

<h3>Хост и ведущий</h3>
<ul>
<li>Ведущий управляет партией: выбирает действия раунда, завершает голосование, отмечает выбывших и отвечает на финальные вопросы.</li>
<li>Хост — браузер, который поддерживает сетевую сессию. Обычно это создатель комнаты. Вкладка хоста должна оставаться открытой.</li>
<li>Хост и ведущий — разные роли. Ведущего можно сменить в лобби, а при отключении хоста сессия может автоматически перейти к другому участнику.</li>
</ul>

<h3>Лобби</h3>
<ul>
<li>Создатель комнаты становится ведущим и может передать роль любому игроку до начала партии.</li>
<li>Лобби разделено на три списка: <b>Ведущий</b>, <b>Игроки</b> и <b>Наблюдатели</b>. Ведущий управляет партией; игроки получают персонажей и участвуют в раундах; наблюдатели видят состояние комнаты, но не получают игровых действий.</li>
<li>До начала партии обычный участник может переключаться между ролями игрока и наблюдателя. Ведущий остаётся отдельной ролью; параметр «Ведущий тоже играет» определяет, получает ли он персонажа.</li>
<li>Все новые подключения после старта автоматически добавляются в наблюдатели. Они видят текущую партию и список наблюдателей, но не могут раскрывать характеристики, голосовать или управлять партией.</li>
<li>Ведущий задаёт, сколько игроков должно остаться в финале, и может выгнать лишнего или задублированного участника. Выгнанный не сможет вернуться в эту комнату.</li>
<li>При старте характеристики выдаются только игрокам. Наблюдатели не входят в число участников партии. Сюжет, размер бункера и планировка помещений общие для всех.</li>
</ul>

<h3>Характеристики персонажа</h3>
<p>У каждого участника 12 характеристик:</p>
<ul>
<li><b>Пол</b> и <b>Раса</b>.</li>
<li><b>Телосложение</b> и <b>Человеческая черта</b>.</li>
<li><b>Профессия</b> и <b>Здоровье</b>.</li>
<li><b>Хобби / увлечение</b> и <b>Фобия / страх</b>.</li>
<li><b>Крупный инвентарь</b> и <b>Малый инвентарь</b>.</li>
<li><b>Доп. сведение</b> и <b>Спец. возможность</b>.</li>
</ul>
<p>Карточки закрыты (🔒), пока игрок сам их не откроет. Своё скрытое значение игрок видит бледным курсивом. Значок <b>ⓘ</b> рядом с карточкой означает подсказку: наведите курсор или нажмите на значок на телефоне.</p>
<ul>
<li>К Полу может добавляться возраст, например «Мужчина (34 года)».</li>
<li>К Телосложению может добавляться рост в сантиметрах.</li>
<li>К Профессии и Хобби может добавляться уровень мастерства.</li>
<li>Для дополнительных параметров можно задать шанс получить пустое уточнение.</li>
</ul>

<h3>Ход игры</h3>
<ul>
<li><b>Выбор действия.</b> Ведущий выбирает «Показ характеристик» или «Голосование на выбывание».</li>
<li><b>Показ характеристик.</b> Каждый живой игрок открывает одну свою карточку в таблице. Когда все показали, ведущий нажимает «Все показали — дальше». Можно провести несколько показов подряд до голосования.</li>
<li><b>Голосование.</b> Каждый участник выбирает одного кандидата. За себя голосовать нельзя. До завершения голосования виден только факт, что игрок проголосовал.</li>
<li><b>Результаты.</b> Ведущий нажимает «Завершить голосование». После этого таблица показывает число голосов и список проголосовавших.</li>
<li><b>Выбывание.</b> Ведущий отмечает проигравшего кнопкой «Выбыл». Если никто не выбывает, используется кнопка «Никто не выбыл». Выбывшие больше не участвуют в голосованиях; ведущий может вернуть игрока кнопкой «Вернуть».</li>
<li>Раунды продолжаются, пока не останется заданное количество участников. Ведущий может завершить игру раньше кнопкой «Завершить игру».</li>
</ul>

<h3>Специальная возможность</h3>
<p>Игрок может активировать свою Спец. возможность во время партии. После активации она показывается всем участникам и появляется в списке активных действий. Ведущий выполняет написанное и отмечает действие кнопкой «Выполнено».</p>

<h3>Размер бункера и помещения</h3>
<p>В начале партии случайно выбираются один вариант размера бункера и одна планировка из набора. Они одинаковы для всех игроков и отображаются рядом с сюжетом. В редакторе каждая строка в поле размеров — отдельный вариант. Каждая строка в поле планировки — отдельный вариант планировки; названия комнат внутри него разделяйте запятыми, точками с запятой или переносами строк.</p>

<h3>События во время партии</h3>
<ul>
<li>Кнопка <b>«События»</b> доступна ведущему во время партии. В меню можно выбрать событие, заранее добавленное в набор, или создать разовое объявление.</li>
<li>После публикации у всех участников открывается отдельное всплывающее окно поверх игры. Оно остаётся открытым, пока ведущий не нажмёт «Закрыть событие». Одновременно может быть активно одно событие.</li>
<li>Разовое событие существует только в текущей партии и не добавляется в сохранённый набор.</li>
<li>В событии можно указать служебную заметку ведущему. Она выводится в интерфейсе ведущего, но не показывается в окне игроков. Это не защищённое поле: содержимое сетевого состояния передаётся браузерам участников, поэтому не записывайте туда секреты.</li>
<li>Сами события не меняют ресурсы или помещения автоматически. Ведущий обсуждает с участниками последствия и вручную отражает принятое решение в показателях или списке помещений.</li>
</ul>

<h3>Показатели убежища и помещения</h3>
<ul>
<li><b>Люди / места</b> — число людей, находящихся в убежище, и вместимость. После старта число людей соответствует персонажам, участвующим в партии. При отметке «Выбыл» счётчик уменьшается, при «Вернуть» — увеличивается. Ведущий может вручную задать другое значение, например с учётом NPC. Этот показатель не связан с настройкой лобби «Сколько должно остаться в финале»: там задаётся условие завершения игры по числу игроков.</li>
<li><b>Провиант</b> и <b>Воздух</b> показываются в формате «текущее значение / норма». Норма по умолчанию — 100%. Значения выше 100% допустимы и могут обозначать запас.</li>
<li>Кнопка «Изменить показатели» позволяет ведущему редактировать все значения в любой момент партии. Изменения сразу синхронизируются у остальных участников.</li>
<li>Потребление еды, ухудшение воздуха, броски кубика и расчёт последствий автоматически не моделируются. Ведущий сам проводит бросок и меняет соответствующие значения.</li>
<li>Список помещений формируется из выбранной планировки. Ведущий может закрыть помещение, вернуть его в строй или добавить новое. Это журнал состояния убежища: игра не удаляет помещение из текста планировки и не рассчитывает последствия автоматически.</li>
</ul>

<h3>Финал и взвешенные вопросы</h3>
<ul>
<li>Когда игра окончена, участники могут открыть оставшиеся характеристики кнопкой «Открыть все мои характеристики». Ведущий может открыть всё сразу у всех.</li>
<li>Ведущий отвечает «Да» или «Нет» на финальные вопросы. У каждого вопроса есть приоритет от 1 до 10.</li>
<li>Если ответ совпадает с требуемым, вопрос приносит количество баллов, равное своему приоритету. Если не совпадает — баллы не начисляются.</li>
<li>Итоговый процент рассчитывается как набранные баллы, делённые на сумму приоритетов всех вопросов. Для победы нужно набрать не менее 70%.</li>
<li><b>Приоритет 10 — критический:</b> неправильный ответ хотя бы на один такой вопрос означает поражение независимо от общего процента.</li>
<li>Приоритеты 8–9 сильно влияют на оценку, но не означают автоматическое поражение. Если приоритет не указан, вопрос получает вес 1.</li>
<li>Вердикт появляется после того, как ведущий ответит на все вопросы.</li>
</ul>

<h3>Инструменты ведущего</h3>
<ul>
<li><b>Подсмотреть скрытое</b> показывает ведущему закрытые значения чужих карточек. По умолчанию выключено.</li>
<li><b>Режим правок</b> добавляет кнопки: 🎲 заменить значение случайным из набора, ✎ изменить вручную, ⇄ поменять местами с другим игроком, 👁 открыть или скрыть.</li>
<li>В ручном значении можно добавить подсказку в квадратных скобках, например <code>Инженер [Умеет чинить генераторы]</code>.</li>
<li>Ведущий может менять статус игроков, передавать роль ведущего в лобби и досрочно завершать партию.</li>
<li><b>События</b> — выбрать событие из набора или создать разовое; опубликованное окно закрывает только ведущий.</li>
<li><b>Показатели убежища</b> — изменить число людей и мест, текущее количество провианта и воздуха, а также их норму.</li>
<li><b>Помещения</b> — закрыть доступ, вернуть помещение или добавить новое.</li>
</ul>

<h3>Набор «Стандартный» и редактор</h3>
<ul>
<li>Встроенный набор один — <b>«Стандартный»</b>. В нём есть базовые характеристики, три сценария катастроф, варианты размеров и планировок бункера, специальные возможности и финальные вопросы.</li>
<li>Собственные наборы создаются на главной странице кнопкой «Новый набор». В каждом поле — по одному варианту на строку.</li>
<li>Варианты сюжета разделяются отдельной строкой <code>---</code>.</li>
<li>К значению можно добавить подсказку в квадратных скобках: <code>Врач [Умеет проводить операции]</code>.</li>
<li>Возраст и рост настраиваются диапазоном, списком готовых значений и вероятностью выбора из списка. Для профессии и хобби задаются уровни мастерства.</li>
<li>Размер бункера и планировка задаются отдельными списками: каждая строка — вариант, из которого случайно выбирается один.</li>
<li>Финальный вопрос записывается как <code>Вопрос [10] | да</code> или <code>Вопрос [2] | нет</code>. Число в квадратных скобках — приоритет от 1 до 10; без него используется 1.</li>
<li>Начальные показатели задаются отдельно: целое число мест, начальный процент провианта и начальный процент воздуха. Норма провианта и воздуха начинается со 100%.</li>
<li>События набора записываются по одной строке в формате <code>Название | Текст для игроков | Заметка ведущему</code>. Заметка необязательна; вертикальная черта отделяет поля. Разовые события можно создать из панели ведущего и не сохранять в набор.</li>
<li>Собственные наборы хранятся только в браузере. Для переноса на другое устройство используйте кнопки «Экспорт» и «Импорт».</li>
<li>При миграции приложения существующие корректные пользовательские наборы сохраняются. Для резервной копии и переноса между устройствами используйте «Экспорт» и «Импорт».</li>
</ul>

<h3>Связь и приватность</h3>
<p>Игра передаёт состояние через публичные MQTT-серверы по WebSocket. Нужен хотя бы один сервер, к которому подключились и вы, и хост. Строка «Серверы связи» показывает состояние подключений. Если связь пропала, попробуйте выйти из комнаты и зайти снова по тому же коду.</p>
<p>Скрытые характеристики скрываются только в интерфейсе: копия состояния партии передаётся браузерам участников. Содержимое событий, включая заметки ведущему, также может присутствовать в передаваемом состоянии, хотя заметки не выводятся в интерфейсе игроков. Это не защищённое хранилище секретов — не используйте игру для передачи личных или конфиденциальных данных. Голоса текущего голосования не показываются остальным до его завершения ведущим.</p>
<h3>Данные, конфиденциальность и использование</h3>
<p>Это бесплатный неофициальный любительский проект. Автор не управляет отдельным сервером приложения или центральной базой данных игроков, но для сайта и сетевой игры используются сторонние сервисы: GitHub Pages, jsDelivr, Discord (по желанию) и публичные MQTT-брокеры. Через MQTT передаются сведения об участниках и игровое состояние. WSS шифрует соединение в пути, но не скрывает содержимое от оператора брокера; игровые сообщения не являются приватными.</p>
<p>Не вводите реальные персональные данные, адреса, телефоны, пароли, документы, медицинские или финансовые сведения. Код комнаты не является паролем. Проект предоставляется бесплатно «как есть», без гарантии бесперебойной работы или сохранности данных. Эти условия не ограничивают права и ответственность, которые нельзя исключить по применимому законодательству.</p>

function normalizeImportedPack(raw,index){const label='Набор #'+(index+1);if(!raw||typeof raw!=='object'||Array.isArray(raw))throw new Error(label+': ожидался объект.');if(typeof raw.id!=='string'||!/^[A-Za-z0-9_-]{1,64}$/.test(raw.id))throw new Error(label+': некорректный ID.');if(BUILTIN.some(x=>x.id===raw.id))throw new Error(label+': ID совпадает со встроенным набором.');if(typeof raw.name!=='string'||!raw.name.trim()||raw.name.length>100)throw new Error(label+': укажите название до 100 символов.');const story=importStrings(raw.story??[],label+' — сюжет',100,5000),bunkerSize=importStrings(raw.bunkerSize??[],label+' — размеры бункера',200,300),rooms=importStrings(raw.rooms??[],label+' — комнаты',200,500);const sourceLists=raw.lists??{};if(!sourceLists||typeof sourceLists!=='object'||Array.isArray(sourceLists))throw new Error(label+': некорректные категории.');const lists={};for(const [k] of K)lists[k]=importStrings(Object.prototype.hasOwnProperty.call(sourceLists,k)?sourceLists[k]:[],label+' — '+k,1000,1000);const sourceQ=raw.q??[];if(!Array.isArray(sourceQ)||sourceQ.length>100)throw new Error(label+': некорректный список вопросов.');const q=sourceQ.map((item,n)=>{if(!item||typeof item!=='object'||Array.isArray(item)||typeof item.t!=='string'||!item.t.trim()||item.t.length>500)throw new Error(label+' — вопрос '+(n+1)+': некорректный текст.');const priority=Number(item.priority??1);if(!Number.isInteger(priority)||priority<1||priority>10)throw new Error(label+' — вопрос '+(n+1)+': приоритет должен быть от 1 до 10.');const need=item.need===undefined||item.need==='y'||item.need===true?'y':item.need==='n'||item.need===false?'n':null;if(!need)throw new Error(label+' — вопрос '+(n+1)+': ответ должен быть «да» или «нет».');return{t:item.t.trim(),priority,need}});const sourceSx=raw.sx??{};if(!sourceSx||typeof sourceSx!=='object'||Array.isArray(sourceSx))throw new Error(label+': некорректные дополнительные параметры.');const sx={};for(const [k,meta] of Object.entries(SX)){const item=sourceSx[k]??{};if(!item||typeof item!=='object'||Array.isArray(item))throw new Error(label+' — параметры '+k+': некорректные данные.');const list=importStrings(item.list??[],label+' — параметры '+k,300,200);const e=Number(item.e??0);if(!Number.isFinite(e)||e<0||e>100)throw new Error(label+' — параметры '+k+': шанс «Пусто» должен быть от 0 до 100.');sx[k]={list,e};if(meta[2]){const lo=item.lo==null||item.lo===''?null:Number(item.lo),hi=item.hi==null||item.hi===''?null:Number(item.hi),p=Number(item.p??50);if((lo!==null&&!Number.isFinite(lo))||(hi!==null&&!Number.isFinite(hi))||(lo!==null&&hi!==null&&hi<lo)||!Number.isFinite(p)||p<0||p>100)throw new Error(label+' — диапазон '+k+': проверьте границы и вероятность.');sx[k].lo=lo;sx[k].hi=hi;sx[k].p=p}}const sourceEvents=raw.events??[];
if(!Array.isArray(sourceEvents)||sourceEvents.length>100)throw new Error(label+': должно быть не более 100 событий.');
const events=sourceEvents.map((item,n)=>{let title,text,gmNote='';if(typeof item==='string'){const parts=item.split('|');title=parts.shift()?.trim();text=parts.shift()?.trim();gmNote=parts.join('|').trim()}else if(item&&typeof item==='object'&&!Array.isArray(item)){title=item.title;text=item.text??item.description;gmNote=item.gmNote??''}if(typeof title!=='string'||!title.trim()||title.length>120||typeof text!=='string'||!text.trim()||text.length>2500||typeof gmNote!=='string'||gmNote.length>1500)throw new Error(label+' — событие '+(n+1)+': проверьте название, описание и заметку ведущего.');return{id:typeof item?.id==='string'&&/^[A-Za-z0-9_-]{1,64}$/.test(item.id)?item.id:'event-'+(n+1),title:title.trim(),text:text.trim(),gmNote:gmNote.trim()}});
const sourceMetrics=raw.metrics??{};
if(!sourceMetrics||typeof sourceMetrics!=='object'||Array.isArray(sourceMetrics))throw new Error(label+': некорректные начальные показатели.');
const metric=(key,fallback,min,max,integer=false)=>{const value=Number(sourceMetrics[key]??fallback);if(!Number.isFinite(value)||value<min||value>max||(integer&&!Number.isInteger(value)))throw new Error(label+': некорректное начальное значение "'+key+'".');return value};

function doStart(){if(R.status!=='lobby')return;R.observers=R.observers||{};const ids=Object.keys(R.players).filter(x=>x!==R.gm||R.gmPlays),s=R.set,pl={};if(ids.length<2){S.err='Для начала игры нужны минимум два участника. Проверьте, что в комнате достаточно игроков с учётом настройки «Ведущий тоже играет».';render();return;}
 K.forEach(([k])=>pl[k]=shuf(s.lists?.[k]?.length?s.lists[k]:['—']));
 const ch={};ids.forEach((id,n)=>{ch[id]={};K.forEach(([k])=>{{const p=sp(pl[k][n%pl[k].length]);ch[id][k]={v:p.v+sfx(s,k),h:p.h,o:0}}})});
 const story=pick(s.story),env={size:pick(s.bunkerSize||[]),rooms:pick(s.rooms||[])};
 upd({status:'play',chars:ch,story,env,facility:initialFacility(env,s,ids.length),eventCatalog:Array.isArray(s.events)?s.events:[],activeEvent:null,phase:'choose',n:1,surv:Math.min(R.surv,Math.max(1,ids.length-1))})}

function closeNet(){netGeneration++;clearInterval(jt);clearInterval(hbt);clearInterval(mt);clearTimeout(bt);myV={};seen.clear();S.note='';B.forEach(b=>{try{b.c.end(true)}catch(e){}});B=[];NET={};isHost=false}
const newer=(a,b)=>!b||(a.ep||0)>(b.ep||0)||((a.ep||0)===(b.ep||0)&&(a.hid===b.hid?(a._v||0)>(b._v||0):String(a.hid)<String(b.hid)));
const resend=()=>{if(!observer()&&R.phase==='vote'&&!R.vdone?.[R.n]&&myV[R.n])pub('h',{t:'u',uid,d:{votes:{[R.n]:{[uid]:myV[R.n]}}},id:nextMsgId()})};
function stepDown(nr){isHost=false;clearInterval(hbt);B.forEach(b=>{try{b.c.unsubscribe('bk26/'+rid+'/h')}catch(e){}});ls('bh',null);R=nr;S.note='Ведение партии перешло к другому игроку.';resend();render()}
function takeover(){isHost=true;R.ep=(R.ep||0)+1;const previousHost=R.hid||R.host;if(!R.set?.lists)restoreRoomSet();if(R.gm===previousHost||!R.players[R.gm]||R.out?.[R.gm]){R.gm=uid;if(!R.gmPlays&&R.chars)delete R.chars[uid]}R.hid=uid;
 const bs=BUILTIN.find(x=>x.id===R.set?.bid);if(bs)R.set={...bs,bid:bs.id};
 if(R.phase==='vote'&&R.votes&&!R.vdone?.[R.n]){R.votes[R.n]={};if(myV[R.n])R.votes[R.n][uid]=myV[R.n]}
 B.forEach(b=>{try{b.c.connected&&b.c.subscribe('bk26/'+rid+'/h',{qos:1})}catch(e){}});
 clearInterval(hbt);hbt=setInterval(()=>R&&pub('s',{t:'s',R:view()}),12000);
 S.note='Прежний хост пропал: ведение партии перешло к вам. Не закрывайте эту вкладку.';bc();render()}
function chk(){if(isHost||!R||!rid||!live())return;const r=Object.keys(R.players).filter(x=>x!==R.hid&&!R.out?.[x]).sort().indexOf(uid);if(r<0)return;if(Date.now()-lastSt>45000+r*10000)takeover()}
function onMsg(m){
 if(m.t==='err'){if(m.uid===uid){S.err=m.e;clearInterval(jt);render()}return}
 if(m.t==='s'){lastSt=Date.now();if(m.R?.status==='lobby'&&m.R.set?.lists)saveRoomSet(rid,m.R.set);
  if(isHost){if(m.R.hid!==uid&&newer(m.R,R))stepDown(m.R);return}
  if(!R||newer(m.R,R)){const f=!R,ne=R&&(m.R.ep||0)>(R.ep||0);R=m.R;R.observers=R.observers||{};clearInterval(jt);if(f)S.scr='room';S.err='';if(ne)resend();render()}
  return}
 if(!isHost)return;
 if(m.id&&!rememberMsg(m.id))return;
 if(m.t==='join'){if(!/^(?:u[a-z0-9]{1,24}|d[0-9]{1,24})$/.test(m.uid||'')||typeof m.name!=='string'||!m.name.trim())return;if(R.ban?.[m.uid]){pub('s',{t:'err',uid:m.uid,e:'Ведущий исключил вас из комнаты'});return}
  R.observers=R.observers||{};const member={name:m.name.trim().slice(0,32),av:m.av||''};
  if(R.players[m.uid])R.players[m.uid]=member;else if(R.observers[m.uid])R.observers[m.uid]=member;else if(R.status==='lobby')R.players[m.uid]=member;else R.observers[m.uid]=member;
  bc();render()}
 else if(m.t==='role'){if(setLobbyRole(m.uid,m.role)){bc();render()}}
 else if(m.t==='u'){if(!m.uid||(m.uid!==R.gm&&!R.players[m.uid])||R.observers?.[m.uid])return;mg(R,m.d);bc();render()}
 else if(m.t==='start'){if(m.uid===R.gm)doStart()}
 else if(m.t==='rr'){if(m.uid!==R.gm)return;mg(R,{chars:{[m.i]:{[m.k]:rollKey(m.k,m.i)}}});bc();render()}}

function net(code,first){if(!window.mqtt){S.err='Не загрузилась библиотека связи: проверьте интернет и обновите страницу';render();return false}
 const generation=netGeneration;rid=code;
 B=BR.map(([n,u])=>{NET[n]='…';const c=mqtt.connect(u,{clientId:'bk'+uid+Math.random().toString(36).slice(2,6),connectTimeout:15000,reconnectPeriod:3000});
  c.on('connect',()=>{if(generation!==netGeneration)return;NET[n]='ok';lastSt=Date.now();c.subscribe('bk26/'+code+'/s',{qos:1});if(isHost)c.subscribe('bk26/'+code+'/h',{qos:1});render();first&&first()});
  c.on('close',()=>{if(generation!==netGeneration)return;NET[n]='✗';render()});c.on('error',()=>{if(generation!==netGeneration)return;NET[n]='✗'});
  c.on('message',(t,p)=>{if(generation!==netGeneration)return;try{onMsg(JSON.parse(p.toString()))}catch(e){}});return{n,c}});clearInterval(mt);mt=setInterval(chk,5000);return true}
function startHost(code,st){closeNet();isHost=true;R=st;S.scr='room';S.err='';if(!net(code,bc)){S.scr='home';isHost=false;R=null;render()}else{hbt=setInterval(()=>R&&pub('s',{t:'s',R:view()}),12000);render()}}
function joinRoom(code){closeNet();R=null;if(!/^[ABCDEFGHJKLMNPQRSTUVWXYZ23456789]{6}$/.test(code)){S.err='Введите корректный шестизначный код комнаты';return render()}
 const j=()=>pub('h',{t:'join',uid,name:S.name.trim().slice(0,32),av:S.dc?.av||'',id:nextMsgId()});S.err='Подключаемся…';
 if(!net(code,j))return;render();jt=setInterval(()=>{if(R)clearInterval(jt);else j()},3000);
 setTimeout(()=>{if(!R&&S.err==='Подключаемся…'){S.err='Нет ответа: комната не найдена или нет связи. Проверьте код и что хост онлайн.';render()}},30000)}
function cell(id,k){const c=R.chars[id][k]||{v:'—',o:1},mine=id===uid,g=gm(),end=R.status==='end';let h,b='';
 if(c.o)h=`<b>${esc(c.v)}</b>`+(k==='spec'?(c.u?' ✔':' ⚡'):'');else if(mine||(g&&peek))h=`<span class=dim>${esc(c.v)}</span>`;else h='🔒';
 if(c.h&&(c.o||mine||(g&&peek)))h+=` <span class=i tabindex=0 data-h="${esc(c.h)}">ⓘ</span>`;
 if(mine&&!c.o&&!R.out[id]){if(k==='spec')b=`<br><button data-a=spec data-i="${esc(id)}">Активировать</button>`;else if(end||(R.phase==='reveal'&&!R.shown?.[R.n]?.[id]))b=`<br><button data-a=rev data-k=${k}>Открыть</button>`}
 if(g&&edit)b+=`<br><button class=g data-a=rr data-i="${esc(id)}" data-k=${k}>🎲</button><button class=g data-a=ed data-i="${esc(id)}" data-k=${k}>✎</button><button class=g data-a=sw data-i="${esc(id)}" data-k=${k}>⇄</button><button class=g data-a=tg data-i="${esc(id)}" data-k=${k}>👁</button>`;
 return `<td class="${c.o?'op':'cl'}">${h}${b}</td>`}

function table(){const ids=Object.keys(R.chars),g=gm(),vt=R.votes?.[R.n]||{},dn=R.vdone?.[R.n],mv=my();
 const rows=ids.map(id=>{const out=R.out[id],cnt=Object.values(vt).filter(x=>x===id).length;let a='';
  if(R.status==='play'&&R.phase==='vote'&&!dn&&!out&&!R.out[uid]&&R.chars[uid]&&id!==uid)a+=`<button class="${mv===id?'on':''}" data-a=vote data-i="${esc(id)}">${mv===id?'✔ Ваш голос':'Голосовать'}</button>`;
  if(R.phase==='vote'&&!dn&&vt[id])a+='<br><span class=mu>✓ проголосовал</span>';
  if(g)a+=out?`<button class=g data-a=back data-i="${esc(id)}">↩ Вернуть</button>`:`<button class=g data-a=out data-i="${esc(id)}">Выбыл</button>`;
  const vs=dn?Object.keys(vt).filter(v=>vt[v]===id).map(v=>R.players[v]?.name).join(', '):'';
  return `<tr class="${out?'out':''}"><td>${av(R.players[id])}<b>${esc(R.players[id]?.name)}</b>${id===R.gm?' 🎙':''}${id===uid?' (вы)':''}${dn&&cnt?`<br>🗳 ${cnt} ← ${esc(vs)}`:''}</td>${K.map(([k])=>cell(id,k)).join('')}<td>${a}</td></tr>`}).join('');
 return `<div class=w><table><tr><th>Игрок</th>${K.map(k=>`<th>${k[1]}</th>`).join('')}<th></th></tr>${rows}</table></div>`}

function banner(g){const ph=R.phase;
 if(ph==='choose')return g?`<b>Выберите тему раунда:</b> <button data-a=ph data-k=reveal>Показ характеристик</button><button data-a=ph data-k=vote>Голосование на выбывание</button>`:'Ведущий выбирает тему раунда…';
 if(ph==='reveal'){const n=Object.keys(R.shown?.[R.n]||{}).filter(i=>!R.out[i]).length;return `<b>Показ характеристик.</b> Показали: ${n}/${al().length}. Откройте одну характеристику в своей строке. `+(g?'<button data-a=endr>Все показали — дальше</button>':'')}
 const n=Object.keys(R.votes?.[R.n]||{}).length,dn=R.vdone?.[R.n];return `<b>Голосование.</b> Проголосовали: ${n}/${al().length}. `+(dn?'Голосование завершено, результаты в таблице. ':g?'<button data-a=vend>Завершить голосование и показать результаты</button> ':'')+(g?'<button class=g data-a=none>Никто не выбыл</button> Проигравшего отметьте кнопкой «Выбыл».':'')}

function endPanel(g){
 const qs=R.set.q||[],an=R.ans||{},done=qs.every((x,i)=>an[i]);
 const weight=x=>Math.max(1,Math.min(10,Number(x.priority)||1));
 const total=qs.reduce((n,x)=>n+weight(x),0);
 const earned=qs.reduce((n,x,i)=>n+(an[i]===x.need?weight(x):0),0);
 const score=total?Math.round(earned/total*100):0;
 const criticalBad=qs.some((x,i)=>weight(x)>=10&&an[i]!==x.need);
 const ok=score>=70&&!criticalBad;
 const bad=qs.filter((x,i)=>an[i]!==x.need).map(x=>x.t);
 return `<div class=card><h3>Финал</h3><p>В бункере остались: <b>${esc(al().map(i=>R.players[i].name).join(', ')||'никто')}</b></p>
 ${R.chars[uid]?'<button data-a=all>Открыть все мои характеристики</button>':''}${g?'<button class=g data-a=allall>Открыть всё у всех</button>':''}
 <h3>Вопросы ведущему</h3>${qs.map((x,i)=>{const w=weight(x);return `<p class="final-question"><span class="q-weight ${w>=10?'q-critical':''}">[${w}]</span> ${esc(x.t)} ${g?`<button class="${an[i]==='y'?'on':'g'}" data-a=ans data-i=${i} data-k=y>Да</button><button class="${an[i]==='n'?'on':'g'}" data-a=ans data-i=${i} data-k=n>Нет</button>`:`<b>${an[i]==='y'?'Да':an[i]==='n'?'Нет':'…'}</b>`}</p>`}).join('')||'<p class=mu>Вопросов в наборе нет</p>'}
 ${done&&qs.length?`<div class="scorebox ${ok?'score-ok':'score-bad'}"><p class=v>${ok?'Выжившие справились!':'Выжившие не справились.'}</p><p><b>Итоговая оценка: ${score}%</b> (${earned} из ${total} весовых баллов).</p><p class=mu>Для выживания нужно набрать не менее 70%. Вопросы с приоритетом 10 являются критическими и обязательными.</p></div>${bad.length?`<p class=mu>Не выполнено: ${esc(bad.join('; '))}</p>`:''}`:''}</div>`}

function observerList(){const ids=Object.keys(R.observers||{});return '<details class="observer-dropdown"><summary><span>Наблюдатели ('+ids.length+')</span><span class="observer-arrow" aria-hidden="true">▾</span></summary><div class="observer-list">'+(ids.length?ids.map(i=>'<p class=pl>'+av(R.observers[i])+esc(R.observers[i].name)+'</p>').join(''):'<p class=mu>Пока никого нет.</p>')+'</div></details>'}

function game(){const g=gm(),end=R.status==='end';
 const sp=Object.keys(R.chars).filter(i=>R.chars[i].spec.o&&!R.chars[i].spec.u).map(i=>'<div class=sp>⚡ <b>'+esc(R.players[i].name)+'</b> активирует способность: '+esc(R.chars[i].spec.v)+' '+(g?'<button data-a=done data-i="'+esc(i)+'">Выполнено</button>':'')+'</div>').join('');
 return observerList()+'<div class=card><b>Сюжет:</b> '+esc(R.story)+'<div class=env-grid><div class=env-item><span>РАЗМЕР БУНКЕРА</span><b>'+esc(R.env?.size||'—')+'</b></div><div class=env-item><span>ПЛАНИРОВКА И ПОМЕЩЕНИЯ</span><b>'+esc(R.env?.rooms||'—')+'</b></div></div><span class=mu>Цель: выжить должны '+R.surv+'</span></div>'+
 facilityPanel(g)+(g?hostTools():'')+(end?'':'<div class="card ban">'+banner(g)+'</div>')+sp+
 (g?'<p><label style="display:inline"><input type=checkbox data-a=peek '+(peek?'checked':'')+'>Подсмотреть скрытое</label> <label style="display:inline"><input type=checkbox data-a=edit '+(edit?'checked':'')+'>Режим правок (🎲 случайное, ✎ вручную, ⇄ обмен, 👁 открыть/скрыть)</label> '+(end?'':'<button class=g data-a=fin>Завершить игру</button>')+'</p>':'')+
 table()+(end?endPanel(g):'')+eventPopup(g)}

function lobby(){const g=gm(),players=Object.keys(R.players||{}).filter(i=>i!==R.gm),observers=Object.keys(R.observers||{}),host=R.players?.[R.gm];
 const gmRow=host?`<p class=pl>${av(host)}${esc(host.name)} 🎙 ведущий${R.gmPlays?' · участвует в игре':' · не участвует в игре'}</p>`:'<p class=mu>Ведущий не назначен.</p>';
 const playerRows=players.map(i=>`<p class=pl>${av(R.players[i])}${esc(R.players[i].name)}${i===uid?' (вы)':''} ${g?`<button class=g data-a=setgm data-i="${esc(i)}">Сделать ведущим</button><button class=g data-a=kick data-i="${esc(i)}">Выгнать</button>`:''}</p>`).join('')||'<p class=mu>Пока нет игроков.</p>';
 const observerRows=observers.map(i=>`<p class=pl>${av(R.observers[i])}${esc(R.observers[i].name)}${i===uid?' (вы)':''} ${g?`<button class=g data-a=kick-observer data-i="${esc(i)}">Выгнать</button>`:''}</p>`).join('')||'<p class=mu>Пока нет наблюдателей.</p>';

 return `<div class=card><div class="role-columns"><section class="role-column"><h3>Ведущий (1)</h3>${gmRow}</section><section class="role-column"><h3>Игроки (${players.length})</h3>${playerRows}</section><section class="role-column"><h3>Наблюдатели (${observers.length})</h3>${observerRows}</section></div>
 <p class=mu>Код комнаты <b>${esc(rid)}</b> — друзья вводят его на главной странице. Подключившиеся после начала партии автоматически попадают в наблюдатели.</p>
 ${roleAction?'<div class="role-switch">'+roleAction+' <span class=mu>Роль можно менять до начала игры.</span></div>':''}
 <label><input type=checkbox data-a=gmp ${R.gmPlays?'checked':''} ${g?'':'disabled'}>Ведущий тоже играет</label>
 <label>Сколько должно остаться в финале <input type=number min=1 value="${esc(R.surv)}" data-a=surv ${g?'':'disabled'}></label>
 <p class=mu>Набор: ${esc(R.set.name)}</p>${g?'<button data-a=start>Начать игру</button>':'<p>Ждём, пока ведущий начнёт…</p>'}</div>`}

function privacyNotice(){return `<div class="privacy-notice" role="note"><b>Важно о данных и приватности</b><p>Не вводите реальные персональные сведения, пароли, документы, медицинские или финансовые данные. Игровые сообщения проходят через публичные сторонние MQTT-сервисы и не являются приватными.</p><a href="https://github.com/Netomur/Bunker/blob/main/PRIVACY.md" target="_blank" rel="noopener noreferrer">Что хранится, куда передаются данные и какие действуют ограничения →</a></div>`}

${privacyNotice()}

 const events=ln(V('e_events')).map((line,n)=>{const parts=line.split('|'),title=(parts.shift()||'').trim(),text=(parts.shift()||'').trim(),gmNote=parts.join('|').trim();if(!title||title.length>120||!text||text.length>2500||gmNote.length>1500)throw new Error('Событие '+(n+1)+': используйте формат «Название | описание | заметка ведущему».');return{id:'event-'+(n+1),title,text,gmNote}});
