.top{display:flex;flex-wrap:wrap;align-items:center;gap:12px;margin:0 0 12px;padding:10px 14px;background:var(--cd);border:1px solid var(--bd);border-radius:14px}.top b{font-size:17px}.top button:first-of-type{margin-left:auto}
label{display:block;margin:10px 0;color:var(--mu);font-size:14px}
input,select,textarea{display:block;width:100%;box-sizing:border-box;margin-top:4px;padding:9px;border:1px solid var(--bd);border-radius:8px;background:var(--bg);color:var(--fg);font:inherit}
input[type=checkbox]{display:inline;width:auto;margin-right:6px}input[type=number]{width:90px}
button{background:var(--ac);color:var(--on);border:0;border-radius:8px;padding:7px 12px;margin:2px;font:inherit;font-weight:600;cursor:pointer}button:hover{filter:brightness(1.1)}
button.g{background:transparent;color:var(--fg);border:1px solid var(--bd);font-weight:500}button.on{outline:2px solid var(--ok)}
.mu{color:var(--mu)}.rl h3{margin:16px 0 6px}.rl ul{padding-left:20px;margin:4px 0}.rl li{margin:3px 0}.err{color:var(--bad);font-weight:600}
.w{overflow-x:auto;border:1px solid var(--bd);border-radius:14px;background:var(--cd);margin:0 0 12px}
table{border-collapse:collapse;width:100%;min-width:1100px;table-layout:fixed}
th,td{border-bottom:1px solid var(--bd);border-right:1px solid var(--bd);padding:7px 6px;vertical-align:top;font-size:var(--tf,13px);overflow-wrap:anywhere}
th{background:var(--c2);text-align:left;font-size:12px;color:var(--mu)}
th:first-child,td:first-child{width:135px;position:sticky;left:0;background:var(--cd);z-index:1}th:last-child,td:last-child{width:110px;border-right:0}
td.cl{color:var(--mu);text-align:center;font-size:16px}td.op{background:var(--c2)}
.dim{color:var(--mu);font-style:italic}.out td{opacity:.45;text-decoration:line-through}
.sp{border:1px solid var(--ac);border-radius:10px;padding:8px;margin:6px 0}
.av{display:inline-block;width:28px;height:28px;border-radius:50%;object-fit:cover;vertical-align:middle;margin-right:6px;background:var(--ac);color:var(--on);text-align:center;line-height:28px;font-weight:700;font-size:14px}
.pl{display:flex;align-items:center;flex-wrap:wrap;gap:4px;margin:6px 0}
.i{display:inline-block;margin-left:4px;color:var(--ac);cursor:help;font-size:14px}
#tip{position:fixed;z-index:30;display:none;max-width:260px;background:#111;color:#fff;padding:8px 10px;border-radius:8px;font-size:13px;pointer-events:none;box-shadow:0 4px 14px #0006}
.ov{position:fixed;inset:0;background:#0008;display:flex;align-items:center;justify-content:center;padding:16px;z-index:9}.ov .card{max-width:360px;width:100%}
.ok{color:var(--ok)}.bad{color:var(--bad)}.v{font-size:20px;font-weight:700}

/* Visual refresh — isolated override layer; remove this block to restore the previous appearance. */
:root{--bg:#f3eff7;--fg:#292331;--cd:#fff;--c2:#eee7f3;--bd:#d8cddd;--ac:#79509a;--on:#fff;--mu:#746a7d;--ok:#2f8c61;--bad:#c34f67;color-scheme:light}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#15121a;--fg:#f1ebf6;--cd:#211b29;--c2:#2d2438;--bd:#493a57;--ac:#bd86df;--on:#201528;--mu:#b5a9bf;--ok:#76d2a0;--bad:#ef8292;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#15121a;--fg:#f1ebf6;--cd:#211b29;--c2:#2d2438;--bd:#493a57;--ac:#bd86df;--on:#201528;--mu:#b5a9bf;--ok:#76d2a0;--bad:#ef8292;color-scheme:dark}
body{background-image:radial-gradient(ellipse at 50% -10%,#8c61a51a,transparent 55%),linear-gradient(180deg,transparent,var(--bg));background-attachment:fixed}
#app{max-width:880px;padding:20px 16px 38px}
#app.wide{max-width:none;padding:12px}
.hero{border:1px solid var(--bd);border-radius:20px;overflow:hidden;box-shadow:0 12px 34px #160d241f;margin-bottom:16px;background-position:center;background-size:cover}
.card{border-radius:17px;padding:17px;margin-bottom:14px;box-shadow:0 5px 18px #21142b0b;transition:border-color .18s,box-shadow .18s}
.card h3{font-size:17px;letter-spacing:.1px}
.home-head{padding:20px 21px}
.home-headline{display:flex;align-items:center;justify-content:space-between;gap:12px}
.eyebrow{display:block;margin-bottom:5px;color:var(--ac);font-size:11px;font-weight:800;letter-spacing:1.6px}
.home-tools{display:flex;gap:6px;flex-wrap:wrap}
.home-lead{margin:11px 0 0;color:var(--mu);font-size:14px}
button{border-radius:10px;padding:8px 13px;transition:filter .16s,transform .16s,box-shadow .16s}
button:not(.g):hover{box-shadow:0 4px 14px color-mix(in srgb,var(--ac) 28%,transparent)}
button:active{transform:translateY(1px)}
button:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible{outline:3px solid color-mix(in srgb,var(--ac) 42%,transparent);outline-offset:2px}
input,select,textarea{border-radius:10px;padding:10px 11px}
textarea{min-height:74px;resize:vertical}
.sp{border-radius:12px;background:color-mix(in srgb,var(--ac) 6%,var(--cd))}
.w{border-radius:16px;box-shadow:0 4px 16px #21142b0b}
th{font-weight:700;letter-spacing:.2px}
.env-grid{display:grid;grid-template-columns:minmax(160px,.8fr) minmax(220px,1.4fr);gap:9px;margin:13px 0 10px}
.env-item{display:flex;flex-direction:column;gap:5px;padding:12px 13px;border:1px solid var(--bd);border-radius:12px;background:var(--c2)}
.env-item span{font-size:10px;letter-spacing:1.2px;font-weight:800;color:var(--mu)}
.env-item b{font-size:14px}
.final-question{display:flex;align-items:center;flex-wrap:wrap;gap:5px;padding:7px 0;border-bottom:1px solid var(--bd)}
.q-weight{display:inline-flex;align-items:center;justify-content:center;min-width:34px;padding:2px 6px;border-radius:7px;background:var(--c2);color:var(--mu);font-size:12px;font-weight:800}
.q-critical{background:color-mix(in srgb,var(--bad) 15%,var(--cd));color:var(--bad)}
.scorebox{margin-top:14px;padding:14px;border:1px solid var(--bd);border-radius:13px}
.scorebox .v{margin:0 0 7px}
.scorebox p{margin:5px 0}
.score-ok{border-color:var(--ok);background:color-mix(in srgb,var(--ok) 8%,var(--cd))}
.score-bad{border-color:var(--bad);background:color-mix(in srgb,var(--bad) 7%,var(--cd))}
@media(max-width:640px){#app{padding:12px 10px 28px}.hero{border-radius:14px}.card{padding:14px}.home-headline{align-items:flex-start;flex-direction:column}.home-tools{width:100%}.env-grid{grid-template-columns:1fr}}

<h3>☢ Что это</h3>
<p>«Бункер» — многопользовательская игра на выживание. После катастрофы группа людей пытается попасть в убежище, но мест внутри меньше, чем желающих. Участники раскрывают характеристики персонажей, спорят и голосуют, кого исключить. В финале ведущий проверяет, сможет ли бункер обеспечить выжившим жизнь.</p>

<h3>Как начать</h3>
<ul>
<li>Введите имя или войдите через Discord. Авторизация необязательна.</li>
<li>Создайте комнату, выберите набор «Стандартный» и отправьте друзьям <b>8-значный код</b>.</li>
<li>Остальные участники вводят этот код в поле «Войти в комнату».</li>
<li>В комнате может быть до 16 участников. Ведущий запускает игру, когда все готовы.</li>
</ul>

<h3>Комната и ведущий</h3>
<ul>
<li>Создатель комнаты автоматически становится ведущим. В лобби он может передать роль другому участнику.</li>
<li>Ведущий управляет раундами, голосованиями, выбыванием и финальными вопросами.</li>
<li>Состояние партии хранится на облачном сервере. Держать вкладку создателя или его компьютер включёнными не требуется.</li>
<li>Для повторного входа с того же браузера используйте прежний код комнаты. Сессионные данные сохраняются локально в этом браузере.</li>
<li>Не публикуйте код комнаты в открытом доступе: он служит приглашением для входа.</li>
<li>Неактивные комнаты автоматически удаляются через 24 часа бездействия.</li>
</ul>

<h3>Лобби</h3>
<ul>
<li>Ведущий может решить, участвует ли он сам в игре, и задать количество игроков, которые должны остаться в финале.</li>
<li>Он может исключить лишнего или задублированного участника. Исключённый игрок не сможет вернуться в эту комнату.</li>
<li>При старте каждому участнику выдаются характеристики. Одновременно выбираются сюжет, размер бункера и планировка помещений — они общие для всей партии.</li>
</ul>

<h3>Характеристики персонажа</h3>
<p>У каждого участника 12 характеристик:</p>
<ul>
<li><b>Пол</b> и <b>Раса</b>.</li>
<li><b>Телосложение</b> и <b>Человеческая черта</b>.</li>
<li><b>Профессия</b> и <b>Здоровье</b>.</li>
<li><b>Хобби / увлечение</b> и <b>Фобия / страх</b>.</li>
<li><b>Крупный инвентарь</b> и <b>Малый инвентарь</b>.</li>
<li><b>Доп. сведение</b> и <b>Спец. возможность</b>.</li>
</ul>
<p>Каждый игрок получает собственные закрытые карточки. Другие участники получают их значения только после раскрытия. Ведущий может использовать функцию «Подсмотреть скрытое» — поэтому выбирайте ведущего, которому доверяете.</p>
<ul>
<li>К Полу может добавляться возраст, например «Мужчина (34 года)».</li>
<li>К Телосложению может добавляться рост в сантиметрах.</li>
<li>К Профессии и Хобби может добавляться уровень мастерства.</li>
<li>Значок <b>ⓘ</b> означает подсказку к карточке: наведите курсор или нажмите на значок на телефоне.</li>
</ul>

<h3>Ход игры</h3>
<ul>
<li><b>Выбор действия.</b> Ведущий выбирает «Показ характеристик» или «Голосование на выбывание».</li>
<li><b>Показ характеристик.</b> Каждый живой игрок открывает одну свою карточку. Когда все показали, ведущий нажимает «Все показали — дальше». До голосования можно провести несколько показов подряд.</li>
<li><b>Голосование.</b> Каждый участник выбирает одного кандидата. За себя голосовать нельзя. До завершения голосования участник видит только собственный выбор; чужие голоса скрыты даже от ведущего.</li>
<li><b>Результаты.</b> Ведущий нажимает «Завершить голосование». После этого всем показываются голоса, количество голосов и список проголосовавших.</li>
<li><b>Выбывание.</b> Ведущий отмечает проигравшего кнопкой «Выбыл». Если никто не выбывает, используется «Никто не выбыл». Выбывших можно вернуть кнопкой «Вернуть».</li>
<li>Раунды продолжаются, пока не останется заданное количество участников. Ведущий может завершить игру раньше.</li>
</ul>

<h3>Специальная возможность</h3>
<p>Игрок может активировать свою Спец. возможность во время партии. После активации она становится видна всем и появляется в списке активных действий. Ведущий выполняет написанное и отмечает действие кнопкой «Выполнено».</p>

<h3>Размер бункера и помещения</h3>
<p>При старте случайно выбираются один вариант размера бункера и одна планировка. Они одинаковы для всех участников и отображаются рядом с сюжетом. В редакторе каждый вариант размера и каждую готовую планировку записывайте с новой строки.</p>

<h3>Финал и взвешенные вопросы</h3>
<ul>
<li>Когда игра окончена, участники могут открыть оставшиеся характеристики кнопкой «Открыть все мои характеристики». Ведущий может открыть всё сразу у всех.</li>
<li>Ведущий отвечает «Да» или «Нет» на финальные вопросы. У каждого вопроса есть приоритет от 1 до 10.</li>
<li>За совпадение ответа с требуемым начисляются баллы, равные приоритету вопроса. За несовпадение баллы не начисляются.</li>
<li>Итоговый процент — набранные баллы, делённые на сумму приоритетов всех вопросов. Для победы нужно набрать не менее 70%.</li>
<li><b>Приоритет 10 — критический:</b> неправильный ответ хотя бы на один такой вопрос означает поражение независимо от общего процента.</li>
<li>Приоритеты 8–9 сильно влияют на оценку, но не означают автоматическое поражение. Если приоритет не указан, вопрос получает вес 1.</li>
</ul>

<code>Сможете ли вы прожить весь год? [1] | да</code>

<h3>Инструменты ведущего</h3>
<ul>
<li><b>Подсмотреть скрытое</b> показывает ведущему закрытые значения чужих карточек. Используйте эту возможность честно и по договорённости компании.</li>
<li><b>Режим правок</b> позволяет заменить значение случайным из набора, изменить вручную, поменять карточки между игроками или открыть / скрыть значение.</li>
<li>В ручное значение можно добавить подсказку в квадратных скобках, например <code>Инженер [Умеет чинить генераторы]</code>.</li>
<li>Ведущий управляет игроками, фазами, голосованиями и финальными ответами. Сервер проверяет, что обычный участник не может отправить команды ведущего.</li>
</ul>

<h3>Набор «Стандартный» и редактор</h3>
<ul>
<li>Встроенный набор один — <b>«Стандартный»</b>. В нём есть базовые характеристики, три сценария катастроф, варианты размеров и планировок, специальные возможности и финальные вопросы.</li>
<li>Собственные наборы создаются на главной странице кнопкой «Новый набор». В каждом поле — по одному варианту на строку.</li>
<li>Варианты сюжета разделяются отдельной строкой <code>---</code>.</li>
<li>Подсказка добавляется в квадратных скобках: <code>Врач [Умеет проводить операции]</code>.</li>
<li>Возраст и рост настраиваются диапазоном и списком готовых значений. Для профессии и хобби задаются уровни мастерства.</li>
<li>Финальный вопрос записывается как <code>Вопрос [10] | да</code> или <code>Вопрос [2] | нет</code>. Число в квадратных скобках — приоритет от 1 до 10; без него используется 1.</li>
<li>Собственные наборы хранятся только в браузере. Для переноса на другое устройство используйте «Экспорт» и «Импорт».</li>
</ul>

<p>Игровое состояние хранится на сервере Cloudflare, а участники подключаются к нему по защищённому WebSocket-соединению. Каждый клиент получает только данные, которые нужны его роли: собственные закрытые карточки, раскрытые карточки остальных участников и состояние партии. Чужие закрытые карточки не отправляются обычным игрокам.</p>
<p>Сервер и его оператор технически имеют доступ к состоянию комнаты. Это не сквозное шифрование от провайдера. Не используйте игру для передачи личных, медицинских, финансовых или иных конфиденциальных сведений.</p>
<p>Discord нужен только для получения ника и аватара. Его авторизация необязательна: можно играть под обычным именем. Код комнаты не является паролем к личным данным — не передавайте его посторонним.</p>

function apiBase(){
 const value=String(window.BUNKER_API_BASE||'').trim();
 if(!value)throw new Error('Облачный сервер ещё не подключён. Сначала нужно развернуть бесплатный сервер из папки cloudflare и указать его адрес в cloudflare-config.js.');
 let u;try{u=new URL(value)}catch{throw new Error('Неверный адрес облачного сервера. Проверьте cloudflare-config.js.')}
 if(u.protocol!=='https:'||!u.hostname.endsWith('.workers.dev'))throw new Error('Адрес сервера должен быть HTTPS-адресом Cloudflare Workers (*.workers.dev).');
 return u.href.replace(/\/$/,'');
}
async function apiPost(path,data){
 const base=apiBase();
 const response=await fetch(base+path,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(data),cache:'no-store'});
 const result=await response.json().catch(()=>({}));
 if(!response.ok)throw new Error(result.error||('Ошибка облачного сервера: '+response.status));
 return result;
}
async function getTurnstileToken(){
 const siteKey=String(window.BUNKER_TURNSTILE_SITE_KEY||'').trim();
 if(!siteKey)return '';
 if(!window.turnstile){
  await new Promise((resolve,reject)=>{
   const started=Date.now();
   const check=()=>{
    if(window.turnstile)return resolve();
    if(Date.now()-started>12000)return reject(new Error('Не загрузилась проверка Cloudflare Turnstile. Обновите страницу.'));
    setTimeout(check,150);
   };
   check();
  });
 }
 return new Promise((resolve,reject)=>{
  const host=document.createElement('div');
  host.style.cssText='position:fixed;left:-10000px;top:-10000px;z-index:-1';
  document.body.append(host);
  let id=null,settled=false;
  const finish=(error,token)=>{
   if(settled)return;settled=true;
   try{if(id!==null)window.turnstile.remove(id)}catch{}
   host.remove();
   error?reject(error):resolve(token);
  };
  try{
   id=window.turnstile.render(host,{
    sitekey:siteKey,
    size:'invisible',
    callback:token=>finish(null,token),
    'error-callback':()=>finish(new Error('Turnstile не смог проверить запрос. Попробуйте ещё раз.')),
    'expired-callback':()=>finish(new Error('Проверка безопасности истекла. Попробуйте ещё раз.'))
   });
   window.turnstile.execute(id);
  }catch(error){finish(new Error(error.message||'Ошибка проверки безопасности.'))}
 });
}

function receiveSecureMessage(event){
 let m;try{m=JSON.parse(event.data)}catch{return}
 if(m.t==='auth'){if(m.ok){NET.cloud='ok';S.err='';render();return}return}
 if(m.t==='err'){S.err=m.e||'Действие отклонено сервером';render();return}
 if(m.t==='s'){
  lastSt=Date.now();R=m.R;

function openSecureSocket(token){
 return new Promise((resolve,reject)=>{
  let settled=false,authed=false;
  const base=apiBase().replace(/^https:/,'wss:');
  const sock=new WebSocket(base+'/ws/'+rid);
  ws=sock;NET.cloud='…';render();
  const finishError=message=>{
   if(settled)return;settled=true;clearTimeout(timer);
   reject(new Error(message||'Не удалось подключиться к облачному серверу.'));
  };
  const timer=setTimeout(()=>{if(!authed){finishError('Сервер не подтвердил подключение за 15 секунд.');try{sock.close()}catch{}}},15000);
  sock.addEventListener('open',()=>{
   try{sock.send(JSON.stringify({type:'auth',uid,token}))}
   catch(e){finishError(e.message)}
  });
  sock.addEventListener('message',event=>{
   let m;try{m=JSON.parse(event.data)}catch{return}
   if(m.t==='auth'&&m.ok){
    authed=true;NET.cloud='ok';S.err='';clearTimeout(timer);
    if(!settled){settled=true;resolve(true)}
    render();return;
   }
   receiveSecureMessage(event);
   if(m.t==='err'&&!authed)finishError(m.e);
  });
  sock.addEventListener('error',()=>{if(!authed)finishError('Не удалось открыть защищённое соединение. Проверьте адрес сервера.')});
  sock.addEventListener('close',()=>{
   if(ws===sock){
    ws=null;NET.cloud='✗';
    if(R&&S.scr==='room'){S.err='Соединение с сервером прервано. Вернитесь на главную и войдите в комнату по тому же коду.';render()}
   }
   if(!authed)finishError('Сервер закрыл подключение до подтверждения сессии.');
  });
 });
}

<div class=card><h3>Создать комнату</h3><p class=mu>${window.BUNKER_API_BASE?'Подключён бесплатный облачный сервер.':'Сетевой сервер ещё не настроен: после его бесплатной публикации игра будет работать через Cloudflare.'}</p><label>Набор<select id=pick>${BUILTIN.map(s=>`<option value="${s.id}">${esc(s.name)} (встроенный)</option>`).join('')}${S.sets.map(s=>`<option value="${s.id}">${esc(s.name)}</option>`).join('')}</select></label><button data-a=create>Создать</button></div>
<div class=card><h3>Войти в комнату</h3><input id=code placeholder="8-значный код комнаты" maxlength=8 style="text-transform:uppercase"><button data-a=join>Войти</button></div>
<div class=card><h3>Собственные наборы</h3><p class=mu>Встроенный набор «Стандартный» уже готов к игре. Здесь можно хранить дополнительные наборы для других компаний или сценариев.</p>${S.sets.map(s=>`<p>${esc(s.name)} <button class=g data-a=edit1 data-i="${s.id}">Изменить</button></p>`).join('')||'<p class=mu>Своих наборов пока нет</p>'}<button data-a=new>Новый набор</button><button class=g data-a=exp>Экспорт</button><label>Импорт из файла<input type=file accept=.json data-a=imp></label><p class=mu>Наборы хранятся в этом браузере. Делайте экспорт, чтобы перенести их на другое устройство.</p></div>`}

function editor(){const e=S.ed;return `<div class=card><button class=g data-a=home>← Назад</button><h2>Редактор набора</h2>
<label>Название<input id=e_name value="${esc(e.name)}"></label>
<p class=mu>В каждое поле — по одному варианту на строку (количество не ограничено). Варианты сюжета разделяйте строкой <code>---</code>. При старте игрокам выпадают случайные варианты. К любому варианту можно дописать подсказку в квадратных скобках: <code>Киллер [Может добавить в Малый инвентарь перочинный нож]</code>. Она покажется значком ⓘ при наведении (на телефоне — при нажатии).</p>
<label>Сюжет (начальная страница партии)<textarea id=e_story rows=6>${esc(e.story)}</textarea></label>
${K.map(([k,n])=>`<label>${n}<textarea id=e_${k} rows=4>${esc(e.lists[k]||'')}</textarea></label>${SX[k]?sxBox(k,e):''}`).join('')}
<label>Размеры бункера (каждый вариант с новой строки; один вариант выбирается при старте)<textarea id=e_bunkerSize rows=3>${esc(e.bunkerSize||'')}</textarea></label><label>Виды комнат и планировки (каждая строка — готовый вариант помещений)<textarea id=e_rooms rows=4>${esc(e.rooms||'')}</textarea></label><label>Вопросы финала: «Вопрос [приоритет 1–10] | да/нет». Без приоритета вопрос получает вес 1. Вопросы с весом 10 критические и обязательные, общий порог выживания — 70%.<textarea id=e_q rows=7>${esc(e.q)}</textarea></label>
<button data-a=save>Сохранить</button>${e.id?'<button class=g data-a=delset>Удалить набор</button>':''}</div>`}

function render(){const v=S.scr==='home'?home():S.scr==='ed'?editor():S.scr==='info'?info():S.scr==='sett'?sett():room();$.className=S.scr==='room'&&R&&R.status!=='lobby'?'wide':'';tip.style.display='none';$.innerHTML=(S.note?`<p class="card ban">${esc(S.note)}</p>`:'')+(S.err?`<p class=err>${esc(S.err)}</p>`:'')+netTxt()+v}

async function act(t){const a=t.dataset.a,i=t.dataset.i,k=t.dataset.k,c=R&&R.chars,me=uid;S.err='';
try{switch(a){
case 'home':S.scr='home';S.err='';render();break;
case 'leave':closeNet();R=null;S.scr='home';render();break;
case 'new':S.ed={id:null,name:'',story:'',lists:{},q:'',bunkerSize:'',rooms:''};S.scr='ed';render();break;
case 'edit1':{const s=S.sets.find(x=>x.id===i);S.ed={id:i,sx:s.sx||{},name:s.name,story:(s.story||[]).join('\n---\n'),lists:Object.fromEntries(K.map(([k])=>[k,(s.lists?.[k]||[]).join('\n')])),bunkerSize:(s.bunkerSize||[]).join('\n'),rooms:(s.rooms||[]).join('\n'),q:(s.q||[]).map(x=>x.t+' ['+(x.priority??1)+'] | '+(x.need==='n'?'нет':'да')).join('\n')};S.scr='ed';render();break}
case 'save':{const V=id=>$.querySelector('#'+id).value,ln=x=>x.split('\n').map(y=>y.trim()).filter(Boolean);
 const d={name:V('e_name').trim()||'Без названия',ownerId:me,sx:getSx(V,ln),story:V('e_story').split(/^\s*---\s*$/m).map(x=>x.trim()).filter(Boolean),lists:Object.fromEntries(K.map(([k])=>[k,ln(V('e_'+k))])),bunkerSize:ln(V('e_bunkerSize')),rooms:ln(V('e_rooms')),q:ln(V('e_q')).map(l=>{const[x,n]=l.split('|'),m=x.match(/\s*\[(\d{1,2})\]\s*$/),t=x.replace(/\s*\[(\d{1,2})\]\s*$/,'').trim();return{t,priority:m?Math.max(1,Math.min(10,+m[1])):1,need:/нет/i.test(n||'')?'n':'y'}})};
 const id=S.ed.id||'s'+Date.now().toString(36),l=(ls('bsets')||[]).filter(x=>x.id!==id);l.push({id,...d});ls('bsets',l);S.scr='home';loadSets();break}
case 'delset':ls('bsets',(ls('bsets')||[]).filter(x=>x.id!==S.ed.id));S.scr='home';loadSets();break;
case 'create':{if(!S.name.trim()){S.err='Введите имя';return render()}
 const p=$.querySelector('#pick').value,s0=[...BUILTIN,...S.sets].find(x=>x.id===p),s={id:s0.id||p,bid:BUILTIN.some(x=>x.id===p)?p:'',name:s0.name,story:s0.story,lists:s0.lists,sx:s0.sx||{},q:s0.q||[],bunkerSize:s0.bunkerSize||[],rooms:s0.rooms||[]};
 await createSecureRoom(s);break}
case 'join':{if(!S.name.trim()){S.err='Введите имя';return render()}
 await joinRoom($.querySelector('#code').value.trim().toUpperCase());break}
case 'exp':{const b=new Blob([JSON.stringify(S.sets)],{type:'application/json'}),l=document.createElement('a');l.href=URL.createObjectURL(b);l.download='bunker-sets.json';l.click();break}
case 'imp':{const f=t.files[0];if(!f)break;const l=JSON.parse(await f.text()),cur=ls('bsets')||[];l.forEach(x=>{const j=cur.findIndex(y=>y.id===x.id);j<0?cur.push(x):cur[j]=x});ls('bsets',cur);loadSets();break}
case 'info':case 'sett':S.prev=S.scr;S.scr=a;render();break;
case 'back2':S.scr=S.prev==='room'&&R?'room':'home';render();break;
case 'acc':ST.ac=k;saveST();render();break;
case 'th':ST.th=k;saveST();render();break;
case 'tf':ST.tf=+k;saveST();render();break;
case 'rst':ST.ac='';ST.th='auto';ST.tf=13;saveST();render();break;
case 'kick':upd({players:{[i]:null},ban:{[i]:true}});break;
case 'dclogin':{const bytes=crypto.getRandomValues(new Uint8Array(24)),state=Array.from(bytes).map(x=>x.toString(16).padStart(2,'0')).join('');sessionStorage.setItem('bunker-discord-state',state);const redirect='https://netomur.github.io/Bunker/';location.href='https://discord.com/oauth2/authorize?client_id='+DISCORD_CLIENT_ID+'&response_type=code&scope=identify&redirect_uri='+encodeURIComponent(redirect)+'&state='+state;break}
case 'dcout':ls('bdc',null);S.dc=null;S.name='';uid=ls('bu');render();break;
case 'setgm':upd({gm:i});break;
case 'gmp':upd({gmPlays:t.checked});break;
case 'surv':upd({surv:Math.max(1,+t.value||1)});break;
case 'start':if(live())pub('h',{t:'start',id:uid+':'+(++sn)});else{S.err='Нет соединения с облачным сервером';render()}break;
case 'peek':peek=t.checked;render();break;
case 'edit':edit=t.checked;render();break;
case 'ph':upd({phase:k,n:R.n+1});break;
case 'endr':upd({phase:'choose'});break;
case 'none':upd({phase:'choose',vdone:{[R.n]:true}});break;
case 'rev':upd({chars:{[me]:{[k]:{o:1}}},shown:{[R.n]:{[me]:true}}});break;
case 'spec':upd({chars:{[i]:{spec:{o:1}}}});break;
case 'done':upd({chars:{[i]:{spec:{u:1}}}});break;
case 'vote':myV[R.n]=i;upd({votes:{[R.n]:{[me]:i}}});render();break;
case 'vend':upd({vdone:{[R.n]:true}});break;
case 'out':{const left=al().filter(x=>x!==i).length;upd({out:{[i]:true},vdone:{[R.n]:true},phase:R.phase==='vote'?'choose':R.phase,status:left<=R.surv?'end':R.status});break}
case 'back':upd({out:{[i]:false}});break;
case 'fin':upd({status:'end'});break;
case 'all':upd({chars:{[me]:Object.fromEntries(K.map(([k])=>[k,{o:1}]))}});break;
case 'allall':upd({chars:Object.fromEntries(Object.keys(c).map(id=>[id,Object.fromEntries(K.map(([k])=>[k,{o:1}]))]))});break;
case 'ans':upd({ans:{[i]:k}});break;
case 'rr':if(live())pub('h',{t:'rr',i,k,id:uid+':'+(++sn)});else{S.err='Нет соединения с облачным сервером';render()}break;
case 'ed':{const v=await ask('Новое значение (подсказку пишите в [ ])',c[i][k].v+(c[i][k].h?' ['+c[i][k].h+']':''));if(v!==null){const p=sp(v);upd({chars:{[i]:{[k]:{v:p.v,h:p.h}}}})}break}
case 'sw':{const o=Object.keys(c).filter(x=>x!==i).map(x=>[x,R.players[x].name]);if(!o.length)break;const j=await ask('Поменять местами с игроком:',0,o);if(j)upd({chars:{[i]:{[k]:{v:c[j][k].v,h:c[j][k].h||''}},[j]:{[k]:{v:c[i][k].v,h:c[i][k].h||''}}}});break}
case 'tg':upd({chars:{[i]:{[k]:{o:c[i][k].o?0:1}}}});break;
}}catch(e){S.err='Ошибка: '+(e.message||e.code||e);render()}}

document.addEventListener('click',e=>{const t=e.target.closest('button[data-a]');t&&act(t)});
document.addEventListener('mouseover',showTip);document.addEventListener('click',showTip);
document.addEventListener('change',e=>{const t=e.target.closest('input[data-a],select[data-a]');t&&act(t)});
document.addEventListener('input',e=>{if(e.target.id==='acc'){ST.ac=e.target.value;saveST()}if(e.target.id==='name'){S.name=e.target.value;try{localStorage.setItem('bn',S.name)}catch(x){}}});

applyST();dcInit().then(loadSets);
</script></body></html>
